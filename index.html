<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#58a98a">
  <title>活動記録表</title>
  <link rel="stylesheet" href="style.css?v=22">
</head>

<body>
  <header class="app-header">
    <h1>活動記録表</h1>
  </header>

  <main>
    <!-- 記録入力画面 -->
    <section id="inputPage" class="page active">
      <div class="card form-card">
        <h2>活動を記録</h2>

        <label for="recordDate">日付</label>
        <input id="recordDate" type="date">

        <label for="recordTime">時刻</label>
        <div class="time-row">
          <input
            id="recordTime"
            type="text"
            inputmode="numeric"
            pattern="[0-9:]*"
            maxlength="5"
            placeholder="例：800"
            autocomplete="off"
          >
          <button id="nowButton" class="sub-button" type="button">
            現在時刻
          </button>
        </div>

        <div class="activity-label-row">
          <label for="activity">活動内容</label>
          <button
            id="openRoutineButton"
            class="routine-open-button"
            type="button"
          >
            定期的な活動
          </button>
        </div>

        <textarea
          id="activity"
          rows="4"
          maxlength="300"
          placeholder="例：散歩を30分した"
        ></textarea>

        <fieldset>
          <legend>気分</legend>
          <div id="moodButtons" class="mood-buttons">
            <button type="button" data-mood="-3">−3</button>
            <button type="button" data-mood="-2">−2</button>
            <button type="button" data-mood="-1">−1</button>
            <button type="button" data-mood="0">0</button>
            <button type="button" data-mood="1">＋1</button>
            <button type="button" data-mood="2">＋2</button>
            <button type="button" data-mood="3">＋3</button>
          </div>
          <p class="mood-guide">
            −3：とても悪い　0：普通　＋3：とても良い
          </p>
        </fieldset>

        <p id="formMessage" class="message" aria-live="polite"></p>

        <div class="form-actions">
          <button
            id="cancelEditButton"
            class="secondary-button hidden"
            type="button"
          >
            編集をキャンセル
          </button>
          <button id="saveButton" class="primary-button" type="button">
            記録する
          </button>
        </div>
      </div>
    </section>

    <!-- 予定入力画面 -->
    <section id="planPage" class="page">
      <div class="card form-card">
        <h2>予定を登録</h2>

        <label for="planActivity">何をするか</label>
        <textarea
          id="planActivity"
          rows="3"
          maxlength="300"
          placeholder="例：散歩をする"
        ></textarea>

        <label for="planDate">開始日・予定日</label>
        <input id="planDate" type="date">

        <label for="planTime">時刻</label>
        <input
          id="planTime"
          type="text"
          inputmode="numeric"
          pattern="[0-9:]*"
          maxlength="5"
          placeholder="例：800"
          autocomplete="off"
        >

        <label for="planRepeat">繰り返し</label>
        <select id="planRepeat">
          <option value="once">その日限り</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
        </select>

        <p class="mood-guide">
          毎週は開始日と同じ曜日に表示します。
        </p>
        <p id="planMessage" class="message" aria-live="polite"></p>

        <div class="form-actions">
          <button
            id="cancelPlanButton"
            class="secondary-button hidden"
            type="button"
          >
            編集をキャンセル
          </button>
          <button
            id="savePlanButton"
            class="primary-button"
            type="button"
          >
            予定を登録
          </button>
        </div>

        <h3>未完了の予定</h3>
        <div id="planList"></div>
      </div>
    </section>

    <!-- 時系列画面 -->
    <section id="timelinePage" class="page">
      <div class="section-heading">
        <h2>時系列で見る</h2>
        <span id="recordCount" class="count-badge">0件</span>
      </div>

      <div class="date-filter">
        <div class="filter-date-field">
          <label for="timelineDisplayDate">表示日</label>
          <input id="timelineDisplayDate" type="date">
        </div>

        <div class="filter-actions">
          <button
            id="timelineResetButton"
            class="secondary-button"
            type="button"
          >
            全て表示
          </button>
          <button
            id="timelinePrintButton"
            class="print-button"
            type="button"
          >
            印刷する
          </button>
        </div>

        <p
          id="timelineFilterMessage"
          class="filter-message"
          aria-live="polite"
        ></p>
      </div>

      <!-- 表示日ごとのメモ -->
      <div id="dailyMemoCard" class="daily-memo-card">
        <label for="dailyMemo">この日のメモ</label>
        <textarea
          id="dailyMemo"
          rows="3"
          maxlength="3000"
          placeholder="表示日を選択すると、その日のメモを入力できます"
          disabled
        ></textarea>

        <div class="daily-memo-actions">
          <p id="dailyMemoMessage" aria-live="polite"></p>
          <button
            id="saveDailyMemoButton"
            class="primary-button"
            type="button"
            disabled
          >
            メモを保存
          </button>
        </div>
      </div>

      <div id="timeline" class="timeline"></div>

      <!-- 予定完了時の入力欄 -->
      <div id="completePanel" class="card hidden">
        <h3>予定を完了</h3>
        <p id="completeDateLabel"></p>

        <label for="completeActivity">活動内容</label>
        <textarea
          id="completeActivity"
          rows="3"
          maxlength="300"
        ></textarea>

        <label for="completeMood">気分</label>
        <select id="completeMood">
          <option value="">選択してください</option>
          <option value="-3">−3</option>
          <option value="-2">−2</option>
          <option value="-1">−1</option>
          <option value="0">0</option>
          <option value="1">＋1</option>
          <option value="2">＋2</option>
          <option value="3">＋3</option>
        </select>

        <p
          id="completeMessage"
          class="message"
          aria-live="polite"
        ></p>

        <div class="form-actions">
          <button
            id="cancelCompleteButton"
            class="secondary-button"
            type="button"
          >
            キャンセル
          </button>
          <button
            id="finishPlanButton"
            class="primary-button"
            type="button"
          >
            完了
          </button>
        </div>
      </div>

      <div
        id="timelinePrintPages"
        class="timeline-print-pages"
        aria-hidden="true"
      ></div>

      <button
        id="clearAllButton"
        class="danger-button"
        type="button"
      >
        すべての記録を削除
      </button>
    </section>

    <!-- グラフ画面 -->
    <section id="graphPage" class="page">
      <div class="card graph-card">
        <h2>気分の推移</h2>
        <p class="graph-note">
          横軸：時刻　縦軸：気分（−3〜＋3）
        </p>

        <div class="date-filter">
          <div class="filter-date-field">
            <label for="graphDisplayDate">表示日</label>
            <input id="graphDisplayDate" type="date">
          </div>

          <div class="filter-actions">
            <button
              id="graphResetButton"
              class="secondary-button"
              type="button"
            >
              全て表示
            </button>
            <button
              id="graphPrintButton"
              class="print-button"
              type="button"
            >
              印刷する
            </button>
          </div>

          <p
            id="graphFilterMessage"
            class="filter-message"
            aria-live="polite"
          ></p>
        </div>

        <div class="canvas-wrap">
          <canvas
            id="moodChart"
            aria-label="時刻ごとの気分グラフ"
          ></canvas>
          <p id="graphEmpty" class="empty-message">
            記録するとグラフが表示されます。
          </p>
        </div>
      </div>
    </section>

    <!-- 検索画面 -->
    <section id="searchPage" class="page">
      <div class="section-heading">
        <h2>記録を検索</h2>
        <span id="searchResultCount" class="count-badge">0件</span>
      </div>

      <div class="search-filter-card">
        <div class="search-period">
          <div class="filter-date-field">
            <label for="searchStartDate">開始日</label>
            <input id="searchStartDate" type="date">
          </div>
          <div class="filter-date-field">
            <label for="searchEndDate">終了日</label>
            <input id="searchEndDate" type="date">
          </div>
        </div>

        <label for="searchKeyword">検索ワード</label>
        <input
          id="searchKeyword"
          type="search"
          placeholder="例：散歩"
        >

        <label for="searchMood">気分</label>
        <select id="searchMood">
          <option value="">指定なし</option>
          <option value="-3">−3</option>
          <option value="-2">−2</option>
          <option value="-1">−1</option>
          <option value="0">0</option>
          <option value="1">＋1</option>
          <option value="2">＋2</option>
          <option value="3">＋3</option>
        </select>

        <div class="search-actions">
          <button
            id="searchButton"
            class="primary-button"
            type="button"
          >
            検索
          </button>
          <button
            id="searchClearButton"
            class="secondary-button"
            type="button"
          >
            クリア
          </button>
        </div>

        <p
          id="searchMessage"
          class="filter-message"
          aria-live="polite"
        ></p>
      </div>

      <div id="searchResults" class="search-results">
        <p class="empty-message">
          期間と検索条件を入力してください。
        </p>
      </div>
    </section>

    <!-- 定期的な活動 -->
    <div
      id="routineModal"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="routineModalTitle"
      aria-hidden="true"
    >
      <div class="routine-modal">
        <div class="routine-modal-header">
          <h2 id="routineModalTitle">定期的な活動</h2>
          <button
            id="closeRoutineButton"
            class="modal-close-button"
            type="button"
            aria-label="閉じる"
          >
            ×
          </button>
        </div>

        <p class="routine-help">
          活動を押すと「活動内容」に入力されます。
        </p>

        <div id="routineList" class="routine-list"></div>

        <button
          id="toggleRoutineSettingsButton"
          class="secondary-button routine-settings-button"
          type="button"
        >
          設定
        </button>

        <div id="routineSettings" class="routine-settings hidden">
          <h3>よくする活動を編集</h3>

          <div class="routine-add-row">
            <input
              id="newRoutineInput"
              type="text"
              maxlength="100"
              placeholder="例：散歩を30分した"
            >
            <button
              id="addRoutineButton"
              class="primary-button"
              type="button"
            >
              追加
            </button>
          </div>

          <div
            id="routineEditList"
            class="routine-edit-list"
          ></div>
        </div>
      </div>
    </div>
  </main>

  <!-- 下部メニュー -->
  <nav class="bottom-nav">
    <button
      type="button"
      class="nav-button active"
      data-page="inputPage"
    >
      <span>✏️</span>
      記録する
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="planPage"
    >
      <span>📅</span>
      予定
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="timelinePage"
    >
      <span>🕒</span>
      時系列
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="graphPage"
    >
      <span>📈</span>
      グラフ
    </button>

    <button
      type="button"
      class="nav-button"
      data-page="searchPage"
    >
      <span>🔍</span>
      検索
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js?v=22"></script>
</body>
</html>
